  <defs
     id="animation_styles">
    <style
       type="text/css"
       id="style3910">
      @keyframes rotate360 {
        from { transform: rotate(360deg); }
        to   { transform: rotate(0deg); }
      }
      @-moz-keyframes rotate360 {
        from { -moz-transform: rotate(360deg); }
        to   { -moz-transform: rotate(0deg); }
      }
      @-webkit-keyframes rotate360 {
        from { -webkit-transform: rotate(360deg); }
        to   { -webkit-transform: rotate(0deg); }
      }

      .animateHeading {
         animation: rotate360 9s linear infinite;
        -moz-animation: rotate360 9s linear infinite;
        -webkit-animation: rotate360 9s linear infinite;
      }

      .animateRoll {
         animation: rotate360 23s linear infinite;
         transform-origin: 50% 50%;
        -moz-animation: rotate360 23s linear infinite;
        -moz-transform-origin: 50% 50%;
        -webkit-animation: rotate360 23s linear infinite;
        -webkit-transform-origin: 50% 50%;
      }

      .object3D { stroke: #FFFFFF; fill: #606060; stroke-width: 1; stroke-linejoin: bevel }
    </style>
    <filter
       inkscape:label="Jigsaw Piece"
       inkscape:menu="Bevels"
       inkscape:menu-tooltip="Low, sharp bevel"
       style="color-interpolation-filters:sRGB;"
       id="filter4284">
      <feSpecularLighting
         in="SourceAlpha"
         surfaceScale="1"
         specularConstant="2"
         specularExponent="18.5"
         id="feSpecularLighting4276">
        <feDistantLight
           elevation="30"
           azimuth="225"
           id="feDistantLight4274" />
      </feSpecularLighting>
      <feComposite
         result="result0"
         operator="atop"
         in2="SourceGraphic"
         id="feComposite4278" />
      <feMorphology
         radius="2"
         result="result1"
         in="SourceAlpha"
         operator="dilate"
         id="feMorphology4280" />
      <feComposite
         in="result0"
         in2="result1"
         id="feComposite4282" />
    </filter>
  </defs>
